services:

  database:
    build: ./database
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  experiment-tracking:
    build: ./services/mlflow
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - mlflow-artifacts:/mlflow-artifacts
    depends_on:
      database:
        condition: service_healthy

  orchestration:
    build: ./services/prefect
    ports:
      - "4200:4200"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web-service:
    build: ./services/web-service
    ports:
      - "8000:8000"
    depends_on:
      orchestration:
        condition: service_healthy
      experiment-tracking:
        condition: service_started
    volumes:
      - batch-data:/batch-data
      - mlflow-artifacts:/mlflow-artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000

  training-service:
    build:
      context: .
      dockerfile: services/training-service/Dockerfile
    depends_on:
      orchestration:
        condition: service_healthy
      experiment-tracking:
        condition: service_started
    volumes:
      - batch-data:/batch-data
      - mlflow-artifacts:/mlflow-artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api

  batch-service:
    build: ./services/batch-service
    depends_on:
      orchestration:
        condition: service_healthy
      experiment-tracking:
        condition: service_started
    volumes:
      - batch-data:/batch-data
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    volumes:
      - batch-data:/batch-data
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data-dashboards:/opt/grafana/dashboards
    ports:
      - "3000:3000"

  monitoring:
    build: ./services/monitoring
    depends_on:
      orchestration:
        condition: service_healthy
      database:
        condition: service_healthy
    volumes:
      - batch-data:/batch-data
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000

volumes:
  postgres-data:
  batch-data:
  mlflow-artifacts:
  grafana-data-dashboards:
